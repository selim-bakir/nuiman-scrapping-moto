# Configuration des éléments surveillés quotidiennement.
# Le scraper est sélectionné automatiquement selon le domaine de l'URL.
#
# Périmètre actuel : casques de la marque SHOEI sur motoblouz.com.

# --- Catégories (listing paginé automatiquement) ---
categories:
  - https://www.motoblouz.com/marque/shoei/casque.html

# --- Produits unitaires (optionnel) ---
# url (requis) · label (option.) · sizes (option., liste blanche de tailles)
products: []

# --- Croisement / double-check (Dafy) --- DÉSACTIVÉ (on se base sur Motoblouz seul)
cross_check: []

# --- Focus : restreindre aux modèles + coloris suivis ---
# On ne garde que ces gammes, en coloris UNIS parmi la liste de couleurs.
focus:
  gammes:
    - GT-AIR 3
    - J-CRUISE 3
  colors:        # couleurs de base des coloris unis suivis (Blanc, Noir mat/brillant, Gris, Bleu)
    - blanc
    - noir
    - gris
    - bleu
  unis_only: true
