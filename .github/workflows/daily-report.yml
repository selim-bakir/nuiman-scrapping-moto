name: Rapport quotidien dispo moto

on:
  schedule:
    # 3 créneaux par heure (minutes 7/27/47, JAMAIS l'heure pile que GitHub sature
    # et saute) : si GitHub en rate un, le suivant rattrape. Le script n'exécute
    # qu'à 7h Paris (garde-fou DST) et UNE seule fois/jour (anti-doublon via l'API).
    # 05h UTC = 7h Paris l'été ; 06h UTC = 7h Paris l'hiver.
    - cron: "7,27,47 5 * * *"
    - cron: "7,27,47 6 * * *"
  # Permet de lancer le rapport manuellement depuis l'onglet Actions.
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read   # pour l'anti-doublon (lecture des runs du jour)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Générer et envoyer le rapport
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCRAPE_CONCURRENCY: "5"
          REQUEST_DELAY_MS: "200"
        run: python -m src.main

      - name: Archiver le rapport JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-json
          path: reports/*.json
          if-no-files-found: ignore
          retention-days: 30
